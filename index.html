<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WMS-TI · Demo ERP Gudang Teknik Industri</title>
<!-- Font IBM Plex dimuat bila online; saat offline otomatis memakai font sistem (tampilan tetap utuh). -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8FAFC;--surface:#FFFFFF;--surface-2:#F1F5F9;--text:#0F172A;--text-2:#475569;--border:#E2E8F0;--border-strong:#CBD5E1;
--primary:#1D4ED8;--primary-h:#1E40AF;--primary-soft:#DBEAFE;--on-primary:#FFFFFF;--link:#1D4ED8;--accent:#F59E0B;
--success:#16A34A;--warning:#D97706;--danger:#DC2626;--info:#2563EB;
--ok-bg:#DCFCE7;--ok-fg:#14532D;--warn-bg:#FEF3C7;--warn-fg:#78350F;--bad-bg:#FEE2E2;--bad-fg:#7F1D1D;--info-bg:#DBEAFE;--info-fg:#1E3A8A;--neu-bg:#E2E8F0;--neu-fg:#1E293B;
--ok-t:#166534;--warn-t:#B45309;--bad-t:#B91C1C;
--focus:#1D4ED8;--shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.08);--r:8px;--tb:56px;--sb:240px;--overlay:rgba(15,23,42,.45)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1220;--surface:#111B30;--surface-2:#17233D;--text:#E8EEF8;--text-2:#A9B7CC;--border:#263553;--border-strong:#3A4B6E;
--primary:#2563EB;--primary-h:#1D4ED8;--primary-soft:#172A57;--link:#93C5FD;--accent:#FBBF24;
--ok-bg:#0F3A22;--ok-fg:#BBF7D0;--warn-bg:#442A07;--warn-fg:#FDE68A;--bad-bg:#4A1414;--bad-fg:#FECACA;--info-bg:#152B5C;--info-fg:#BFDBFE;--neu-bg:#243250;--neu-fg:#E2E8F0;
--ok-t:#86EFAC;--warn-t:#FCD34D;--bad-t:#FCA5A5;--focus:#93C5FD;--shadow:0 1px 2px rgba(0,0,0,.45);--overlay:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1220;--surface:#111B30;--surface-2:#17233D;--text:#E8EEF8;--text-2:#A9B7CC;--border:#263553;--border-strong:#3A4B6E;
--primary:#2563EB;--primary-h:#1D4ED8;--primary-soft:#172A57;--link:#93C5FD;--accent:#FBBF24;
--ok-bg:#0F3A22;--ok-fg:#BBF7D0;--warn-bg:#442A07;--warn-fg:#FDE68A;--bad-bg:#4A1414;--bad-fg:#FECACA;--info-bg:#152B5C;--info-fg:#BFDBFE;--neu-bg:#243250;--neu-fg:#E2E8F0;
--ok-t:#86EFAC;--warn-t:#FCD34D;--bad-t:#FCA5A5;--focus:#93C5FD;--shadow:0 1px 2px rgba(0,0,0,.45);--overlay:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text)}
body{margin:0;font:16px/1.5 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text)}
h1,h2,h3{margin:0;line-height:1.25}
h1{font-size:24px;font-weight:600}h2{font-size:16px;font-weight:600}h3{font-size:14px;font-weight:600}
p{margin:0}
button,input,select{font:inherit;color:inherit}
.mono,.num{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.num{text-align:right}
.muted{color:var(--text-2)}
.sm{font-size:14px}.xs{font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:8px;top:-48px;background:var(--primary);color:var(--on-primary);padding:8px 16px;border-radius:var(--r);z-index:100}
.skip:focus{top:8px}
.ic{flex:none;vertical-align:middle}
/* shell */
.app{display:grid;grid-template-columns:var(--sb) minmax(0,1fr);min-height:100vh}
.app.collapsed{--sb:72px}
.sidebar{background:var(--surface);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:12px 12px;gap:4px;overflow:hidden}
.brand{display:flex;align-items:center;gap:12px;height:40px;padding:0 8px;margin-bottom:12px;font-weight:700;white-space:nowrap}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--text-2);line-height:1.1}
.nav-btn{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:var(--r);border:0;background:none;color:var(--text-2);cursor:pointer;width:100%;text-align:left;white-space:nowrap;font-weight:500}
.nav-btn:hover{background:var(--surface-2);color:var(--text)}
.nav-btn[aria-current=page]{background:var(--primary-soft);color:var(--link);font-weight:600}
.nav-btn .cnt{margin-left:auto;background:var(--accent);color:#0F172A;border-radius:99px;font-size:12px;font-weight:700;padding:0 8px;min-width:22px;text-align:center}
.app.collapsed .nav-btn span.lbl,.app.collapsed .brand .bt,.app.collapsed .cnt{display:none}
.app.collapsed .nav-btn{justify-content:center;padding:0}
.side-foot{margin-top:auto;font-size:12px;color:var(--text-2);padding:8px}
.app.collapsed .side-foot{display:none}
.main-col{min-width:0}
.topbar{position:sticky;top:0;z-index:30;height:var(--tb);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 24px}
.tb-sp{flex:1}
.gsearch{position:relative;flex:0 1 420px;min-width:0}
.gsearch input{width:100%;height:40px;padding:0 12px 0 38px;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--bg)}
.gsearch .ic{position:absolute;left:12px;top:11px;color:var(--text-2)}
.pop{position:absolute;top:46px;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px;z-index:40;max-height:360px;overflow:auto}
.pop[hidden]{display:none}
.pop button{display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:8px;min-height:44px;border-radius:6px;cursor:pointer}
.pop button:hover{background:var(--surface-2)}
.pop .grp{font-size:12px;color:var(--text-2);padding:8px 8px 4px}
.notif-pop{left:auto;right:0;width:360px;top:48px}
.wh{height:40px;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--surface);padding:0 8px}
main{padding:24px;max-width:1440px;margin:0 auto;outline:none}
/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-h)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.icon{width:44px;padding:0;position:relative}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.bdg{position:absolute;top:2px;right:0;background:var(--danger);color:#fff;border-radius:99px;font-size:11px;font-weight:700;min-width:18px;padding:0 5px;line-height:18px;text-align:center}
.field{display:flex;flex-direction:column;gap:4px}
.field label,.lbl-s{font-size:14px;font-weight:500}
.input,.select{height:40px;padding:0 12px;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--surface);min-width:0}
.input.err{border-color:var(--danger)}
.err-t{color:var(--bad-t);font-size:12px;display:flex;gap:4px;align-items:center}
.help{font-size:12px;color:var(--text-2)}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:16px}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;top:0;right:0;bottom:0;left:0;cursor:pointer}
.seg span{display:flex;align-items:center;min-height:40px;padding:0 14px;font-size:14px;font-weight:500;border-right:1px solid var(--border);cursor:pointer}
.seg label:last-child span{border-right:0}
.seg input:checked+span{background:var(--primary);color:var(--on-primary)}
.seg input:focus-visible+span{outline:2px solid var(--focus);outline-offset:-2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tab{min-height:44px;padding:0 16px;border:0;border-bottom:3px solid transparent;background:none;color:var(--text-2);font-weight:500;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
.tab[aria-selected=true]{color:var(--link);border-bottom-color:var(--primary);font-weight:600}
.tab .cnt{background:var(--accent);color:#0F172A;border-radius:99px;font-size:12px;font-weight:700;padding:0 8px}
/* layout */
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.page-head .sub{color:var(--text-2);font-size:14px;margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px}
.grid-2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;margin-bottom:16px}
.grid-eq{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
.split{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media(max-width:1180px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-2,.split,.grid-eq{grid-template-columns:minmax(0,1fr)}.grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}.hide-md{display:none}}
@media(max-width:1023px){.app{--sb:72px}.app .nav-btn span.lbl,.app .brand .bt,.app .cnt,.app .side-foot{display:none}.app .nav-btn{justify-content:center;padding:0}main{padding:16px}.topbar{padding:0 16px}.notif-pop{width:min(360px,90vw)}}
/* KPI */
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.kpi-l{font-size:14px;color:var(--text-2);font-weight:500}
.kpi-v{font-size:28px;font-weight:600;line-height:1.2}
.kpi-d{font-size:13px;display:flex;align-items:center;gap:4px}
.kpi-d.good{color:var(--ok-t)}.kpi-d.badc{color:var(--bad-t)}.kpi-d.neu{color:var(--text-2)}
.kpi-f{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:4px}
.spark{display:block}
.spark polyline{stroke:var(--primary);fill:none;stroke-width:2}
.spark circle{fill:var(--primary)}
[data-theme=dark] .spark polyline{stroke:#93C5FD}[data-theme=dark] .spark circle{fill:#93C5FD}
/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.b-success{background:var(--ok-bg);color:var(--ok-fg)}.b-warning{background:var(--warn-bg);color:var(--warn-fg)}.b-danger{background:var(--bad-bg);color:var(--bad-fg)}.b-info{background:var(--info-bg);color:var(--info-fg)}.b-neutral{background:var(--neu-bg);color:var(--neu-fg)}
.cls{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;padding:1px 6px;border-radius:4px;border:1px solid var(--border-strong);background:var(--surface-2)}
.cls-A{border-color:var(--primary);color:var(--link)}
/* tables */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.tbl th{position:sticky;top:var(--tb);z-index:5;background:var(--surface-2);text-align:left;font-weight:600;padding:8px 12px;border-bottom:1px solid var(--border-strong);white-space:nowrap;font-size:13px}
.tbl th.num{text-align:right}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr.clk{cursor:pointer}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tr.sel{background:var(--primary-soft)}
.tbl .sortb{border:0;background:none;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:6px 0;min-height:32px}
.tbl.fix{table-layout:fixed}
.td-trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chk{width:20px;height:20px;accent-color:var(--primary)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.empty{text-align:center;padding:40px 16px;color:var(--text-2)}
.empty h3{color:var(--text);margin:8px 0 4px;font-size:16px}
.skel{background:var(--surface-2);border-radius:var(--r);height:20px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
/* alerts */
.alert{display:flex;gap:12px;padding:12px;border:1px solid var(--border);border-radius:var(--r);border-left-width:4px}
.alert.bad{border-left-color:var(--danger)}.alert.warn{border-left-color:var(--warning)}.alert.info{border-left-color:var(--info)}
.alert h3{margin-bottom:2px}
.alert ul{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:8px}
.alert li{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px}
/* charts */
.chart-wrap{position:relative}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--text-2);font-size:12px;font-family:inherit}
.chart .grid{stroke:var(--border);stroke-width:1}
.chart .ln{fill:none;stroke:var(--primary);stroke-width:2.5}
[data-theme=dark] .chart .ln{stroke:#93C5FD}
.chart .tg{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4}
.chart .dot{fill:var(--surface);stroke:var(--primary);stroke-width:2}
[data-theme=dark] .chart .dot{stroke:#93C5FD}
.chart .cursor{stroke:var(--text-2);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;top:0;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:6px 10px;border-radius:6px;font-size:12px;pointer-events:none;white-space:nowrap;z-index:5}
.tip[hidden]{display:none}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--text-2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:22px;height:0;border-top:3px solid var(--primary)}
.sw.dash{border-top:3px dashed var(--accent)}
.sw.box{width:14px;height:14px;border:1px solid var(--border-strong);border-radius:3px}
.bar-a{fill:var(--primary)}
.bar-b{fill:var(--text-2)}
/* matrix */
.mx{display:grid;grid-template-columns:48px repeat(3,minmax(0,1fr));gap:8px;align-items:stretch}
.mx-h{font-size:13px;font-weight:600;color:var(--text-2);display:flex;align-items:center;justify-content:center;text-align:center}
.mx-c{border:1px solid var(--border-strong);border-radius:var(--r);background:var(--surface);padding:10px;text-align:left;cursor:pointer;min-height:96px;display:flex;flex-direction:column;gap:2px}
.mx-c:hover{border-color:var(--primary)}
.mx-c[aria-pressed=true]{outline:2px solid var(--primary);outline-offset:1px;background:var(--primary-soft)}
.mx-c b{font-size:20px}
.mx-c .st{font-size:12px;color:var(--text-2);line-height:1.3}
.mx-c.i1{border-left:6px solid var(--primary)}.mx-c.i2{border-left:6px solid var(--text-2)}.mx-c.i3{border-left:6px dashed var(--border-strong)}
/* map */
.map-wrap{position:relative}
.map-svg{width:100%;height:auto;display:block;background:var(--surface-2);border-radius:var(--r)}
.map-svg text{fill:var(--text);font-family:inherit}
.rack{cursor:pointer}
.rack rect.c{stroke:var(--surface);stroke-width:1}
.rack:focus-visible{outline:none}
.rack:focus-visible rect.c,.rack.sel rect.c{stroke:var(--text);stroke-width:3}
.rack.hl rect.c{stroke:var(--accent);stroke-width:3;animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.55}}
.rack.empty rect.c{fill:var(--surface);stroke:var(--border-strong);stroke-dasharray:3 2}
.zlab{font-size:13px;font-weight:700}
.scale{display:inline-block;width:160px;height:12px;border-radius:6px;background:linear-gradient(90deg,hsl(142 62% 48%),hsl(71 62% 48%),hsl(0 62% 48%));vertical-align:middle;margin:0 6px}
.hatch{display:inline-block;width:16px;height:16px;border:1px solid var(--border-strong);background:repeating-linear-gradient(45deg,var(--text) 0 2px,transparent 2px 6px);vertical-align:middle;margin-right:4px}
.maptip{position:absolute;background:var(--text);color:var(--bg);padding:6px 10px;border-radius:6px;font-size:12px;pointer-events:none;z-index:5;transform:translate(-50%,-110%);white-space:nowrap}
.maptip[hidden]{display:none}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin:0}
.dl dt{color:var(--text-2)}.dl dd{margin:0}
.linkbtn{background:none;border:0;padding:6px 0;min-height:32px;color:var(--link);font:inherit;cursor:pointer;text-align:left;text-decoration:underline}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:99px;padding:2px 10px}
.sug{border:1px solid var(--border);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.sug.best{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.progress{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border)}
.progress i{display:block;height:100%;background:var(--primary)}
.formula{font-family:'IBM Plex Mono',monospace;font-size:13px;background:var(--surface-2);border-radius:var(--r);padding:10px 12px;line-height:1.7;overflow-wrap:anywhere}
/* overlay */
#overlay .scrim{position:fixed;top:0;right:0;bottom:0;left:0;background:var(--overlay);z-index:60}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--surface);z-index:61;box-shadow:-8px 0 24px rgba(0,0,0,.25);display:flex;flex-direction:column;animation:slideIn .2s ease-out}
@keyframes slideIn{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.drawer-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px;border-bottom:1px solid var(--border)}
.drawer-b{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border-radius:12px;z-index:61;padding:20px;box-shadow:0 16px 48px rgba(0,0,0,.35);animation:fadeIn .2s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.picker{position:fixed;top:0;right:0;bottom:0;left:0;background:var(--bg);z-index:62;display:flex;flex-direction:column;padding:24px;gap:16px;overflow:auto}
.picker .big{font-size:56px;font-weight:700;line-height:1.1}
.picker-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:24px;width:100%;max-width:1200px;margin:auto;align-items:start}.pk-info{text-align:center}.sticky-act{position:sticky;bottom:0;background:var(--bg);padding:12px 0 4px;width:100%;max-width:1200px;margin:0 auto}.halo{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}.pulse{animation:blink 1s ease-in-out infinite}.lgd{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle}
@media(max-width:900px){.picker-grid{grid-template-columns:minmax(0,1fr)}}
.picker .btn{min-height:56px;font-size:18px;padding:0 24px}

<script>
'use strict';
/* ================= Utilitas ================= */
const $=(s,el=document)=>el.querySelector(s);
const nf0=new Intl.NumberFormat('id-ID',{maximumFractionDigits:0});
const nf1=new Intl.NumberFormat('id-ID',{minimumFractionDigits:1,maximumFractionDigits:1});
const nf2=new Intl.NumberFormat('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt=n=>nf0.format(n),f1=n=>nf1.format(n),f2=n=>nf2.format(n);
const rp=n=>'Rp '+nf0.format(Math.round(n));
const rpShort=n=>{const a=Math.abs(n);return a>=1e9?'Rp '+nf1.format(n/1e9)+' M':a>=1e6?'Rp '+nf1.format(n/1e6)+' jt':'Rp '+nf0.format(n)};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const sum=a=>a.reduce((x,y)=>x+y,0);
const avg=a=>a.length?sum(a)/a.length:0;
const stdev=a=>{if(a.length<2)return 0;const m=avg(a);return Math.sqrt(sum(a.map(v=>(v-m)**2))/(a.length-1))};
const pad=(n,w)=>String(n).padStart(w,'0');
function hash01(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return((h>>>0)%10000)/10000}
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const TODAY='2026-11-03';
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const dFmt=iso=>new Intl.DateTimeFormat('id-ID',{day:'numeric',month:'short',timeZone:'UTC'}).format(new Date(iso+'T00:00:00Z'));
const dFmtY=iso=>new Intl.DateTimeFormat('id-ID',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).format(new Date(iso+'T00:00:00Z'));

/* ================= Rumus teknik industri (fungsi murni) ================= */
const Z_TABLE={90:1.28,95:1.65,97.5:1.96,99:2.33,99.5:2.58};
const eoqF=(D,S,H)=>(D>0&&H>0&&S>0)?Math.sqrt(2*D*S/H):0;
const ssF=(z,sd,L)=>z*sd*Math.sqrt(L);
const ropF=(d,L,ss)=>d*L+ss;
function classifyABC(vals){ // vals: [{id,val}] -> Map id->'A'|'B'|'C'
  const sorted=vals.slice().sort((a,b)=>b.val-a.val),tot=sum(sorted.map(v=>v.val)),m=new Map();let cum=0;
  sorted.forEach((v,i)=>{cum+=v.val;const sh=tot?cum/tot:1;m.set(v.id,i===0||sh<=0.80?'A':sh<=0.95?'B':'C')});return m}
const classifyXYZ=cv=>cv<0.5?'X':cv<=1.0?'Y':'Z';
function tripLen(pts,dock){let cx=dock.x,cy=dock.y,len=0;const rest=pts.slice();
  while(rest.length){let bi=0,bd=1e9;rest.forEach((p,i)=>{const d=Math.abs(p.x-cx)+Math.abs(p.y-cy);if(d<bd){bd=d;bi=i}});const p=rest.splice(bi,1)[0];len+=bd;cx=p.x;cy=p.y}
  return len+Math.abs(cx-dock.x)+Math.abs(cy-dock.y)}

/* ================= Geometri gudang ================= */
const G={ZW:24,ZH:16,CW:2.4,CH:2,GAP:4,COLS:10,ROWS:8,DOCK:{x:-3,y:18}};
const ZONES=['A','B','C','D','E','F'];
function buildLocs(){const locs=[];
  ZONES.forEach((z,zi)=>{const zc=zi%3,zr=Math.floor(zi/3);
    for(let r=1;r<=G.ROWS;r++)for(let c=1;c<=G.COLS;c++){
      const level=((r-1)%4)+1,side=r<=4?1:2;
      const x=zc*(G.ZW+G.GAP)+(c-0.5)*G.CW,y=zr*(G.ZH+G.GAP)+(r-0.5)*G.CH;
      locs.push({id:`${z}${side}-${pad(c,2)}-${level}`,zone:z,zc,zr,r,c,level,x,y,dist:Math.abs(x-G.DOCK.x)+Math.abs(y-G.DOCK.y),skuId:null,units:0,cap:0})}});
  const mx=Math.max(...locs.map(l=>l.dist));
  locs.forEach(l=>{l.dn=l.dist/mx;l.ergo=l.level===1?0.5:(l.level===4?1:0);l.cost=0.7*l.dn+0.3*l.ergo});
  return locs}

/* ================= State data ================= */
const VERSION='wms-ti-demo-v2',KEY='wms-ti-demo-db',THEME_KEY='wms-ti-theme';
const DEF_SET={sl:95,S:150000,hr:0.25};
let DB=null,IDX=null,STORAGE_OK=true;
function reindex(){IDX={sku:new Map(DB.skus.map(s=>[s.id,s])),loc:new Map(DB.locs.map(l=>[l.id,l])),sup:new Map(DB.suppliers.map(s=>[s.id,s]))}}

function recompute(){
  const t0=performance.now(),{sl,S,hr}=DB.settings,z=Z_TABLE[sl]||1.65;
  const items=DB.skus.map(s=>{const D=sum(s.monthly),m=D/12,sd=stdev(s.monthly);return{s,D,m,sd,val:D*s.price}});
  const abc=classifyABC(items.map(i=>({id:i.s.id,val:i.val})));
  items.forEach(i=>{const s=i.s,L=IDX.sup.get(s.supplierId).L,cv=i.m>0?i.sd/i.m:0,d=i.D/365,sdd=i.sd/Math.sqrt(30),H=s.price*hr;
    const ssx=ssF(z,sdd,L),eo=Math.max(1,Math.ceil(eoqF(i.D,S,H))),rp0=ropF(d,L,ssx);
    s.dv={D:i.D,d,sd:i.sd,sdd,cv,val:i.val,abc:abc.get(s.id),xyz:classifyXYZ(cv),L,H,z,ssx,ss:Math.ceil(ssx),eoq:eo,rop:Math.ceil(rp0),freq:i.D/s.lq}});
  return performance.now()-t0}

/* ----- Seed ----- */
function seedDb(){
  const R=rng(20261103);
  const gauss=()=>{let u=0;while(u===0)u=R();const v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
  const rnd=(a,b)=>a+(b-a)*R(),pick=a=>a[Math.floor(R()*a.length)];
  const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const suppliers=[['S01','PT Sinar Bearing Nusantara',7],['S02','PT Bautindo Mandiri',4],['S03','CV Lubrindo Jaya',5],['S04','PT Filtra Karya',10],['S05','PT Kabelindo Perkasa',14],['S06','PT Safety Prima',6],['S07','PT Global Bearing Import',21],['S08','PT Mitra Fastener',3],['S09','PT Pelumas Utama',9],['S10','PT Kabel Metal Sejahtera',18],['S11','CV Teknik Filtrasi',12],['S12','PT Pelindung Kerja Abadi',8]].map(a=>({id:a[0],name:a[1],L:a[2]}));
  const CATSUP={'Bearing':['S01','S07'],'Baut & Mur':['S02','S08'],'Pelumas':['S03','S09'],'Filter':['S04','S11'],'Kabel':['S05','S10'],'APD':['S06','S12']};
  const items=[];
  const add=(cat,code,name,price,uom,base,lq)=>items.push({cat,code,name,price:Math.max(100,Math.round(price/100)*100),uom,base,lq});
  /* Bearing 70 */
  ['6000','6001','6002','6003','6004','6005','6200','6201','6202','6203','6204','6205','6206','6207','6208','6209','6300','6301','6302','6303','6304','6305','6306','6307'].forEach(t=>['2RS','ZZ'].forEach(s=>{const n=+t.slice(-2),k=t[1]==='3'?1.6:t[1]==='2'?1.2:1;add('Bearing',`BRG-${t}-${s}`,`Bearing bola ${t}-${s}`,(22000+n*6500)*k*(s==='2RS'?1.12:1),'pcs',90,3)}));
  ['NU204','NU205','NU206','NU207','NU208','NU209','NU210','NU212'].forEach(t=>add('Bearing',`BRG-${t}-E`,`Bearing rol silinder ${t}E`,95000+(+t.slice(-2))*16000,'pcs',40,2));
  ['22208','22209','22210','22211','22212','22214'].forEach(t=>add('Bearing',`BRG-${t}-E`,`Bearing rol bola ${t}E`,230000+(+t.slice(-2))*32000,'pcs',25,1));
  ['30204','30205','30206','30207','30208','30209'].forEach(t=>add('Bearing',`BRG-${t}-J2`,`Bearing rol tirus ${t} J2`,80000+(+t.slice(-2))*11000,'pcs',35,2));
  ['51104','51105'].forEach(t=>add('Bearing',`BRG-${t}`,`Bearing aksial ${t}`,60000+(+t.slice(-2))*5000,'pcs',20,2));
  /* Baut & Mur 70 */
  {const L={6:[16,25,40],8:[20,30,50],10:[25,40,60,80],12:[30,50,60,80],14:[40,60,80],16:[40,60,80,100],20:[60,80,100],24:[80,100]};
   Object.keys(L).forEach(sz=>L[sz].forEach(len=>['8.8','10.9'].forEach(g=>add('Baut & Mur',`BMR-M${sz}x${len}-${g}`,`Baut hex M${sz}×${len} kelas ${g}`,300+sz*len*7.5*(g==='10.9'?1.5:1),'pcs',2500,50))));
   [6,8,10,12,14,16,20,24].forEach(sz=>{add('Baut & Mur',`BMR-NUT-M${sz}`,`Mur hex M${sz} kelas 8`,150+sz*sz*10,'pcs',3000,60);add('Baut & Mur',`BMR-WSH-M${sz}`,`Ring pir M${sz} galvanis`,60+sz*sz*4,'pcs',3500,80)});
   add('Baut & Mur','BMR-ANC-M12x120','Baut angkur M12×120',9000,'pcs',400,20);add('Baut & Mur','BMR-ANC-M16x150','Baut angkur M16×150',18000,'pcs',250,10)}
  /* Pelumas 30 */
  [['GRS-EP2','Grease EP2 lithium',78000,'kg'],['HYD46','Oli hidrolik ISO VG 46',38000,'L'],['HYD68','Oli hidrolik ISO VG 68',40000,'L'],['GER150','Oli gear ISO VG 150',42000,'L'],['GER220','Oli gear ISO VG 220',44000,'L'],['CMP68','Oli kompresor ISO VG 68',52000,'L'],['ENG15W40','Oli mesin 15W-40',46000,'L'],['CUTSOL','Cairan pemotong larut air',36000,'L'],['TRF32','Oli trafo ISO VG 32',55000,'L'],['CHNLUB','Pelumas rantai tahan panas',85000,'L']].forEach(p=>
    [[5,'05',0,60,2],[20,'20',0.06,90,2],[200,'200',0.12,12,1]].forEach(k=>add('Pelumas',`PLM-${p[0]}-${k[1]}${p[3]==='kg'?'K':'L'}`,`${p[1]} ${k[0]} ${p[3]}`,p[2]*k[0]*(1-k[2]),k[0]===200?'drum':'pail',k[3],k[4])));
  /* Filter 45 */
  {const used=new Set();[['OIL','Filter oli spin-on',70000,8],['HYD','Filter hidrolik return line',210000,8],['AIR','Filter udara primer',180000,8],['FUL','Filter solar & separator air',95000,8],['CMP','Elemen separator kompresor',650000,7],['PNL','Elemen filter udara panel',45000,6]].forEach(t=>{let n=0;while(n<t[3]){const num=1000+Math.floor(R()*9000);if(used.has(num))continue;used.add(num);n++;add('Filter',`FLT-${t[0]}-${num}`,`${t[1]} tipe ${num}`,t[2]*rnd(.7,1.6),'pcs',60,2)}})}
  /* Kabel 35 */
  {const cb=[['NYY',2,2.5],['NYY',4,10],['NYY',4,16],['NYY',4,25],['NYY',4,50],['NYM',3,1.5],['NYM',3,2.5],['NYM',3,4],['NYAF',1,1.5],['NYAF',1,2.5],['NYAF',1,6],['NYAF',1,10],['NYAF',1,16],['NYYHY',4,1.5],['NYYHY',7,1.5],['NYYHY',12,1.5],['NYCY',4,16],['NYCY',4,25],['NYA',1,2.5],['NYA',1,4],['NYFGbY',4,16]];
   const pm=c=>4000+c[1]*c[2]*2200;
   cb.forEach(c=>add('Kabel',`KBL-${c[0]}-${c[1]}x${c[2]}-R100`,`Kabel ${c[0]} ${c[1]}×${c[2]} mm² (roll 100 m)`,pm(c)*100,'roll',14,1));
   cb.slice(0,14).forEach(c=>add('Kabel',`KBL-${c[0]}-${c[1]}x${c[2]}-R500`,`Kabel ${c[0]} ${c[1]}×${c[2]} mm² (drum 500 m)`,pm(c)*500*.95,'drum',3,1))}
  /* APD 50 */
  ['Putih','Kuning','Biru','Merah'].forEach(c=>add('APD',`APD-HLM-${c.slice(0,3).toUpperCase()}`,`Helm safety HDPE ${c}`,68000,'pcs',160,4));
  [['Katun',9000,'KTN'],['Kulit',38000,'KLT'],['Nitril',22000,'NTR'],['Anti-potong',85000,'ATP']].forEach(g=>['L','XL'].forEach(sz=>add('APD',`APD-GLV-${g[2]}-${sz}`,`Sarung tangan ${g[0]} ${sz}`,g[1],'pasang',700,12)));

function routeMap(w,cur){const Wm=G.ZW*3+G.GAP*2,Hm=G.ZH*2+G.GAP,S=8,px=x=>20+(x+6)*S,py=y=>16+y*S,st=w.stops,n=st.length,hasCur=cur!=null,tgt=hasCur&&cur<n?IDX.loc.get(st[cur].locId):null;
  let g=ZONES.map((z,i)=>{const zc=i%3,zr=Math.floor(i/3),on=tgt&&tgt.zone===z;return`<rect x="${px(zc*(G.ZW+G.GAP))}" y="${py(zr*(G.ZH+G.GAP))}" width="${G.ZW*S}" height="${G.ZH*S}" fill="${on?'var(--primary-soft)':'var(--surface)'}" stroke="${on?'var(--primary)':'var(--border-strong)'}" stroke-width="${on?2:1}" rx="4"/><text x="${px(zc*(G.ZW+G.GAP))+G.ZW*S-6}" y="${py(zr*(G.ZH+G.GAP))+16}" font-size="12" font-weight="700" text-anchor="end" opacity=".8">Zona ${z}</text>`}).join('');
  const pts=[G.DOCK,...st.map(s=>IDX.loc.get(s.locId)),G.DOCK];

    if(!hasCur)sty='stroke="var(--primary)" stroke-width="2" stroke-dasharray="5 3"';
    else if(k<cur)sty='stroke="#15803D" stroke-width="3"';
    else if(k===cur)sty='stroke="var(--primary)" stroke-width="5"';
    else sty='stroke="var(--text-2)" stroke-width="2" stroke-dasharray="5 4" opacity=".75"';
    g+=`<path d="M${px(a.x)} ${py(a.y)}H${px(b.x)}V${py(b.y)}" fill="none" stroke-linejoin="round" ${sty}/>`}
  g+=`<rect x="${px(-7)}" y="${py(15)}" width="${4*S}" height="${6*S}" fill="var(--accent)" rx="3"/><text x="${px(-5)}" y="${py(18)+4}" font-size="11" font-weight="700" text-anchor="middle" style="fill:#0F172A">DOCK</text>`;
  st.forEach((s,k)=>{if(hasCur&&k===cur)return;const l=IDX.loc.get(s.locId),x=px(l.x),y=py(l.y);
    g+=s.done?`<circle cx="${x}" cy="${y}" r="8" fill="#15803D"/><path d="M${x-4} ${y} l3 3 l5 -6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>`
      :`<circle cx="${x}" cy="${y}" r="9" fill="var(--primary)"/><text x="${x}" y="${y+4}" font-size="11" font-weight="700" text-anchor="middle" style="fill:#fff">${k+1}</text>`});
  if(tgt){const x=px(tgt.x),y=py(tgt.y);g+=`<circle class="pulse" cx="${x}" cy="${y}" r="18" fill="none" stroke="var(--accent)" stroke-width="3"/><circle cx="${x}" cy="${y}" r="12" fill="var(--accent)" stroke="var(--text)" stroke-width="2"/><text x="${x}" y="${y+4}" font-size="12" font-weight="700" text-anchor="middle" style="fill:#0F172A">${cur+1}</text><text class="halo" x="${x+24}" y="${y-12}" font-size="13" font-weight="700">${tgt.id}</text>`}
  if(hasCur){const a=pts[Math.min(cur,pts.length-2)],x=px(a.x),y=py(a.y);g+=`<polygon points="${x},${y-9} ${x-7},${y+6} ${x+7},${y+6}" fill="var(--text)" stroke="var(--surface)" stroke-width="2"/><text class="halo" x="${x-12}" y="${y+4}" font-size="12" font-weight="700" text-anchor="end">Anda di sini</text>`}
  return`<svg class="map-svg" viewBox="0 0 ${20+(Wm+8)*S} ${24+Hm*S}" role="img" aria-label="Rute picking ${w.id}: ${n} perhentian, ${f1(w.dist)} meter${tgt?`. Tujuan berikutnya ${tgt.id}`:''}">${g}</svg>`}

VIEWS.analitik=()=>{const f=UI.an,set=DB.settings,items=DB.skus.map(s=>({s,h:onHand(s),o:OO.get(s.id)||0,st:stockStatus(s,OO)}));
  const mx={};['A','B','C'].forEach(a=>['X','Y','Z'].forEach(x=>mx[a+x]={n:0,v:0}));const tv=sum(DB.skus.map(s=>s.dv.val));
  DB.skus.forEach(s=>{const c=mx[s.dv.abc+s.dv.xyz];c.n++;c.v+=s.dv.val});
  const cell=k=>{const c=mx[k],cl=k[0]==='A'?'i1':k[0]==='B'?'i2':'i3';return`<button class="mx-c ${cl}" data-act="anCell" data-c="${k}" aria-pressed="${f.cell===k}"><span class="mono xs muted">${k}</span><b class="mono">${c.n} SKU</b><span class="xs">${f1(c.v/tv*100)}% nilai</span><span class="st">${STRAT[k]}</span></button>`};
  let rows=items.slice();if(f.cell)rows=rows.filter(x=>x.s.dv.abc+x.s.dv.xyz===f.cell);

  rows.sort((a,b)=>{const A=g(a),B=g(b);return(A<B?-1:A>B?1:0)*f.dir});
  const per=10,pages=Math.max(1,Math.ceil(rows.length/per));if(f.page>pages)f.page=pages;const pg=rows.slice((f.page-1)*per,f.page*per);
  if(!f.row||!IDX.sku.get(f.row))f.row=(rows[0]||items[0]).s.id;

VIEWS.slotting=()=>{const t0=performance.now(),lim=UI.slot.limit,prop=proposeLayoutLimited(lim),cur=simDistance(currentLayout()),pr=simDistance(prop),ms=performance.now()-t0,sav=cur-pr,pct=cur?sav/cur*100:0;

const dPct=(a,b)=>b?(a-b)/b*100:0;
function baMap(map,tr,label){const S=7,px=x=>16+(x+6)*S,py=y=>14+y*S,Wm=G.ZW*3+G.GAP*2,Hm=G.ZH*2+G.GAP;
  let g=ZONES.map((z,i)=>{const zc=i%3,zr=Math.floor(i/3);return`<rect x="${px(zc*(G.ZW+G.GAP))}" y="${py(zr*(G.ZH+G.GAP))}" width="${G.ZW*S}" height="${G.ZH*S}" fill="var(--surface)" stroke="var(--border-strong)" rx="4"/><text x="${px(zc*(G.ZW+G.GAP))+G.ZW*S-6}" y="${py(zr*(G.ZH+G.GAP))+14}" font-size="11" font-weight="700" text-anchor="end" opacity=".7">Zona ${z}</text>`}).join('');
  ['C','B','A'].forEach(k=>DB.skus.forEach(s=>{if(s.dv.abc!==k)return;const l=map.get(s.id),r=k==='A'?3.6:k==='B'?2.8:2.1;g+=`<circle cx="${px(l.x)}" cy="${py(l.y)}" r="${r}" fill="${CLSC[k][0]}" stroke="var(--surface)" stroke-width=".7" opacity="${k==='C'?.6:1}"/>`}));
  g+=`<rect x="${px(-7)}" y="${py(15)}" width="${4*S}" height="${6*S}" fill="var(--accent)" rx="3"/><text x="${px(-5)}" y="${py(18)+4}" font-size="10" font-weight="700" text-anchor="middle" style="fill:#0F172A">DOCK</text>`;
  if(tr){const ord=tripOrder(tr.pts,G.DOCK),pts=[G.DOCK,...ord,G.DOCK];
    for(let k=0;k<pts.length-1;k++){const a=pts[k],b=pts[k+1];g+=`<path d="M${px(a.x)} ${py(a.y)}H${px(b.x)}V${py(b.y)}" fill="none" stroke="var(--text)" stroke-width="2" stroke-dasharray="5 3" stroke-linejoin="round"/>`}
    ord.forEach((l,k)=>{g+=`<circle cx="${px(l.x)}" cy="${py(l.y)}" r="8" fill="var(--accent)" stroke="var(--text)" stroke-width="1.5"/><text x="${px(l.x)}" y="${py(l.y)+4}" font-size="10" font-weight="700" text-anchor="middle" style="fill:#0F172A">${k+1}</text>`})}
  return`<svg class="map-svg" viewBox="0 0 ${16+(Wm+8)*S} ${22+Hm*S}" role="img" aria-label="${esc(label)}">${g}</svg>`}
function baHtml(prop,same){const b=beforeAfter(prop),ex=b.ex,dm=b.mC-b.mA;
  const row=(n,a,c,d)=>`<tr><td>${n}</td><td class="num mono">${a}</td><td class="num mono">${c}</td><td class="num mono">${d}</td></tr>`;
  const zr=(n,z)=>`<tr><td>${n}</td>${ZONES.map(k=>`<td class="num mono">${f1(z[k])}%</td>`).join('')}</tr>`;
  const lab=(w,tr)=>tr?`${w}: contoh pesanan ${tr.id}, ${tr.pts.length} lokasi, rute ${f1(tr.dist)} meter`:`${w}: sebaran SKU di gudang`;
  return`<section class="card" style="margin-bottom:16px"><div class="card-h"><h2>Sebelum dan sesudah slotting</h2><span class="xs muted">Titik biru = kelas A, kuning = B, abu = C</span></div>
  ${same?'<p class="sm muted" style="margin-bottom:8px">Layout sekarang sudah sama dengan usulan, jadi tidak ada selisih. Kembalikan layout awal untuk melihat perbandingannya.</p>':''}
  <div class="ba-grid"><div><h3 style="margin-bottom:4px">Sekarang</h3>${baMap(currentLayout(),ex&&ex.c,lab('Sekarang',ex&&ex.c))}</div><div><h3 style="margin-bottom:4px">Usulan</h3>${baMap(prop,ex&&ex.a,lab('Usulan',ex&&ex.a))}</div></div>
  ${ex?`<p class="sm ba-note"><b>Contoh nyata:</b> pesanan <span class="mono">${esc(ex.c.id)}</span> (${ex.c.pts.length} lokasi) menempuh <b class="mono">${f1(ex.c.dist)} m</b> sekarang dan <b class="mono">${f1(ex.a.dist)} m</b> setelah relokasi, ${f1((ex.c.dist-ex.a.dist)/ex.c.dist*100)}% lebih pendek. Angka di peta menunjukkan urutan kunjungan.</p>`:''}
  <h3 style="margin:16px 0 8px">Ringkasan per pesanan (rata-rata ${b.n} pesanan)</h3>
  <table class="tbl ba-tbl"><thead><tr><th>Ukuran</th><th class="num">Sekarang</th><th class="num">Usulan</th><th class="num">Selisih</th></tr></thead><tbody>
  ${row('Jarak tempuh (m)',f1(b.dC),f1(b.dA),sgn(dPct(b.dA,b.dC)))}${row('Waktu picking (menit)',f2(b.mC),f2(b.mA),sgn(dPct(b.mA,b.mC)))}${row('Kapasitas (pesanan/jam/picker)',f1(b.pC),f1(b.pA),sgn(dPct(b.pA,b.pC)))}${row('Waktu hemat per 100 pesanan (menit)','',f1(dm*100),'')}</tbody></table>
  <p class="help" style="margin-top:8px">Waktu = jarak ÷ 72 m/menit + ${f2(PK.line)} menit × baris + ${PK.setup} menit persiapan. Angka ini asumsi model, bukan hasil studi waktu.</p>
  <h3 style="margin:16px 0 8px">Beban picking per zona (% baris per tahun)</h3>
  <table class="tbl ba-tbl"><thead><tr><th></th>${ZONES.map(k=>`<th class="num">Zona ${k}</th>`).join('')}</tr></thead><tbody>${zr('Sekarang',b.zC)}${zr('Usulan',b.zA)}</tbody></table>
  <p class="help" style="margin-top:8px">Dock berada di kiri bawah. Zona D paling dekat dock. Setelah slotting, porsi picking bergeser ke zona yang dekat dock.</p></section>`}

/* ================= VIEW: Sensitivitas ================= */
UI.sens={pct:.2,sku:null};
function tornadoSvg(rows,base){const W=560,LW=176,PW=W-LW-8,mid=LW+PW/2,rh=34,H=rows.length*rh+30;
  const dl=r=>dPct(r.lo.cost,base.cost),dh=r=>dPct(r.hi.cost,base.cost),mx=Math.max(1,...rows.map(r=>Math.max(Math.abs(dl(r)),Math.abs(dh(r))))),sc=(PW/2-52)/mx;
  let g=`<text x="${mid-8}" y="12" font-size="11" text-anchor="end" opacity=".75">parameter turun</text><text x="${mid+8}" y="12" font-size="11" opacity=".75">parameter naik</text><line x1="${mid}" y1="20" x2="${mid}" y2="${H-4}" stroke="var(--border-strong)"/>`;
  rows.forEach((r,i)=>{const y=26+i*rh;g+=`<text x="0" y="${y+rh/2+1}" font-size="13">${esc(r.l)}</text>`;
    [[dl(r),r.lol],[dh(r),r.hil]].forEach(([v,pl])=>{const w=Math.abs(v)*sc,x=v<0?mid-w:mid,pos=v>0;
      g+=`<rect x="${x}" y="${y+7}" width="${w}" height="${rh-14}" rx="3" fill="${pos?'var(--warning)':'var(--success)'}"/>`+(pl!=='—'?`<text x="${pos?mid+w+6:mid-w-6}" y="${y+rh/2+4}" font-size="12" font-weight="600" text-anchor="${pos?'start':'end'}">${sgn(v)}</text>`:'')})});
  return`<svg class="chart tornado" viewBox="0 0 ${W} ${H}" role="img" aria-label="Diagram tornado: dampak perubahan parameter terhadap total biaya persediaan">${g}</svg>`}
function curveSvg(s){const v=s.dv,S0=DB.settings.S,q0=eoqF(v.D,S0,v.H);if(q0<=0)return'';
  const W=560,Hh=236,L=70,R=16,T=14,B=44,pw=W-L-R,ph=Hh-T-B,qa=q0*.4,qb=q0*2.5,tc=q=>tcF(v.D,S0,v.H,q),cmin=tc(q0),y0=cmin*.85,y1=tc(qa)*1.03,X=q=>L+(q-qa)/(qb-qa)*pw,Y=c=>T+(1-(c-y0)/(y1-y0))*ph;
  let g='';for(let k=0;k<=4;k++){const c=y0+(y1-y0)*k/4,y=Y(c);g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--border)"/><text x="${L-8}" y="${y+4}" font-size="11" text-anchor="end">${rpShort(c)}</text>`}
  g+=`<rect x="${X(q0*.8)}" y="${T}" width="${X(q0*1.2)-X(q0*.8)}" height="${ph}" fill="var(--primary-soft)" opacity=".8"/>`;
  [.5,1,1.5,2,2.5].forEach(m=>{g+=`<text x="${X(q0*m)}" y="${Hh-24}" font-size="11" text-anchor="middle">${fmt(q0*m)}</text>`});
  g+=`<text x="${L+pw/2}" y="${Hh-6}" font-size="12" text-anchor="middle">Jumlah per pesanan (Q)</text>`;
  let d='';for(let k=0;k<=80;k++){const q=qa+(qb-qa)*k/80;d+=(k?'L':'M')+X(q).toFixed(1)+' '+Y(tc(q)).toFixed(1)}
  g+=`<path d="${d}" fill="none" stroke="var(--primary)" stroke-width="2.5"/><circle cx="${X(q0)}" cy="${Y(cmin)}" r="5" fill="var(--primary)" stroke="var(--surface)" stroke-width="2"/><text x="${X(q0)}" y="${Y(cmin)-12}" font-size="12" font-weight="700" text-anchor="middle">EOQ ${fmt(q0)}</text>`;
  return`<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Kurva biaya tahunan terhadap Q untuk ${esc(s.code)}; minimum pada EOQ ${fmt(q0)}, rentang ±20% hampir datar">${g}</svg>`}
VIEWS.sensitivitas=()=>{const f=UI.sens,pct=f.pct,tor=sensTornado(pct),base=tor.base,rows=tor.rows,top=rows[0];
  const byVal=DB.skus.filter(s=>s.dv.eoq>=5).sort((a,b)=>b.dv.val-a.dv.val),sel=IDX.sku.get(f.sku)||byVal[0],v=sel.dv,q0=eoqF(v.D,DB.settings.S,v.H),cmin=tcF(v.D,DB.settings.S,v.H,q0);
  const pen=m=>(0.5*(1/m+m)-1)*100,ssTop=rows.slice().sort((a,b)=>Math.abs(b.hi.ssVal-b.lo.ssVal)-Math.abs(a.hi.ssVal-a.lo.ssVal))[0];
  const cell=(r,k)=>`${sgn(dPct(r.lo[k],base[k]))} / ${sgn(dPct(r.hi[k],base[k]))}`;
  const tb=rows.map(r=>`<tr><td>${esc(r.l)}<div class="xs muted">${r.lol} / ${r.hil}</div></td><td class="num mono">${cell(r,'cost')}</td><td class="num mono">${cell(r,'ssVal')}</td><td class="num mono">${cell(r,'cycVal')}</td></tr>`).join('');
  const pn=[.5,.8,1.2,1.5,2].map(m=>`<tr><td>Q = ${Math.round(m*100)}% dari EOQ (${fmt(q0*m)})</td><td class="num mono">+${f1(pen(m))}%</td></tr>`).join('');
  return head('Analitik Teknik Industri','Seberapa peka keputusan persediaan terhadap kesalahan asumsi',verifyChip())+anTabs('sensitivitas')+
  `<section class="card" style="margin-bottom:16px"><div class="toolbar" style="margin-bottom:0"><fieldset style="border:0;padding:0;margin:0"><legend class="lbl-s" style="padding:0;margin-bottom:4px">Besar perubahan parameter</legend><div class="seg" role="radiogroup">${[10,20,30].map(p=>`<label><input type="radio" name="spct" value="${p}" data-bind="sensPct" ${Math.round(pct*100)===p?'checked':''}><span>±${p}%</span></label>`).join('')}</div></fieldset>
   <p class="sm muted" style="margin:0;flex:1;min-width:220px">Parameter diubah satu per satu pada seluruh ${fmt(DB.skus.length)} SKU. Titik acuan: service level ${String(DB.settings.sl).replace('.',',')}%, S = ${rp(DB.settings.S)}, H = ${Math.round(DB.settings.hr*100)}% harga per tahun.</p></div></section>
  <div class="grid-4"><div class="card kpi"><span class="kpi-l">Biaya persediaan relevan</span><span class="kpi-v mono">${rpShort(base.cost)}</span><span class="xs muted">pesan + simpan stok siklus + simpan SS, per tahun</span></div>
   <div class="card kpi"><span class="kpi-l">Nilai safety stock</span><span class="kpi-v mono">${rpShort(base.ssVal)}</span><span class="xs muted">tanpa pembulatan, sebagai acuan</span></div>
   <div class="card kpi"><span class="kpi-l">Nilai stok siklus</span><span class="kpi-v mono">${rpShort(base.cycVal)}</span><span class="xs muted">Σ (EOQ ÷ 2) × harga</span></div>
   <div class="card kpi"><span class="kpi-l">Paling peka</span><span class="kpi-v" style="font-size:18px">${esc(top.l)}</span><span class="xs muted">biaya ${sgn(dPct(top.lo.cost,base.cost))} sampai ${sgn(dPct(top.hi.cost,base.cost))}</span></div></div>
  <div class="grid-2"><section class="card"><div class="card-h"><h2>Dampak ke total biaya</h2><span class="xs muted">diurutkan dari paling peka</span></div>${tornadoSvg(rows,base)}
    <p class="help" style="margin-top:8px">Hijau berarti biaya turun, oranye berarti naik. Semua parameter bergerak searah dengan biaya, jadi bar kiri berasal dari parameter yang diturunkan.</p></section>
   <section class="card" style="padding:0"><div class="card-h" style="padding:16px 16px 0"><h2>Rincian dampak</h2></div><table class="tbl ba-tbl"><thead><tr><th>Parameter</th><th class="num">Biaya total</th><th class="num">Nilai SS</th><th class="num">Stok siklus</th></tr></thead><tbody>${tb}</tbody></table><p class="help" style="padding:8px 16px 16px">Setiap sel: perubahan jika parameter turun / naik.</p></section></div>
  <section class="card" style="margin-bottom:16px"><div class="card-h"><h2>Temuan dari data ini</h2></div><ul class="demo-list">
   <li><b>${esc(top.l)}</b> paling mempengaruhi total biaya. Perubahan ${Math.round(pct*100)}% menggeser biaya ${sgn(dPct(top.lo.cost,base.cost))} sampai ${sgn(dPct(top.hi.cost,base.cost))}.</li>
   <li>Nilai safety stock paling peka terhadap <b>${esc(ssTop.l)}</b> (${sgn(dPct(ssTop.lo.ssVal,base.ssVal))} sampai ${sgn(dPct(ssTop.hi.ssVal,base.ssVal))}). Menaikkan service level satu tingkat berarti menambah modal yang terikat di stok pengaman.</li>
   <li>Biaya pesan dan biaya simpan berpengaruh kecil pada total biaya karena EOQ meredamnya: EOQ hanya berubah sebesar akar dari perubahan S ÷ H.</li></ul></section>
  <section class="card"><div class="card-h"><h2>Mengapa EOQ tahan salah tebak</h2><div class="field" style="min-width:220px"><label for="sensSku" class="sr">Pilih SKU</label><select id="sensSku" class="select" data-bind="sensSku">${byVal.slice(0,30).map(s=>`<option value="${s.id}" ${s.id===sel.id?'selected':''}>${esc(s.code)} · kelas ${s.dv.abc}${s.dv.xyz}</option>`).join('')}</select></div></div>
   ${q0>0?`<div class="grid-2"><div>${curveSvg(sel)}<p class="help">Area biru = Q dalam ±20% dari EOQ. Kurva hampir datar di sana.</p></div>
   <div><div class="formula">TC(Q) = D÷Q · S + Q÷2 · H<br>D = ${fmt(v.D)} /thn · S = ${fmt(DB.settings.S)} · H = ${fmt(v.H)}<br>EOQ = ${fmt(q0)} · TC minimum = √(2·D·S·H) = <b>${rpShort(cmin)}</b>/thn</div>
   <table class="tbl" style="margin-top:12px"><thead><tr><th>Jika memesan</th><th class="num">Tambahan biaya</th></tr></thead><tbody>${pn}</tbody></table><p class="help" style="margin-top:8px">Tambahan = ½(Q*÷Q + Q÷Q*) − 1. Memesan 20% terlalu banyak atau sedikit hanya menambah sekitar 1,7% biaya, jadi akurasi S dan H tidak perlu sempurna.</p></div></div>`:empty('Tidak ada permintaan','SKU ini tidak punya permintaan, EOQ tidak terdefinisi.')}</section>`};

init();
</script>
</body>
</html>
